}
table {

}

        if (await save(next, true)) {
          view = "roster";
          selection = null;
          await launchTeam(state.teams.length - 1);
          render();
        }
      } catch (error) {
        busy = false;
        message = "";
        problem = error.message;
        canRetry = false;
        render();
      }
    } else if (action === "member") {
      selection = { team: Number(target.dataset.team), member: target.dataset.member };
      render();
      document.querySelector(".inspector")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    } else if (action === "close-details") {
      selection = null;
      render();
    } else if (action === "retry" || action === "test-connection") {
      connectionReady = false;
      await load();
    } else if (action === "refresh-tabs") {
      await refreshTargets();
      render();
    } else if (action === "launch-existing") {
      try {
        await launchTeam(Number(target.dataset.team));
      } catch (error) {
        problem = error.message;
        canRetry = false;
        render();
      }
    }
  });
  app.addEventListener("input", (event) => {
    const target = event.target;
    if (target.dataset.form) {
      form[target.dataset.form] = target.value;
      updatePreview();
    }
  });
  app.addEventListener("change", async (event) => {
    const target = event.target;
    if (target.hasAttribute("data-launch-mode")) {
      launchMode = target.value;
    } else if (target.dataset.agent !== void 0) {
      const i = Number(target.dataset.agent);
      form.agents[i] = target.value;
      form.models[i] = "default";
      form.efforts[i] = "default";
      render();
    } else if (target.dataset.model !== void 0) {
      const i = Number(target.dataset.model);
      form.models[i] = target.value.trim() || "default";
      if (form.models[i] === "default") form.efforts[i] = "default";
      render();
    } else if (target.dataset.effort !== void 0) {
      form.efforts[Number(target.dataset.effort)] = target.value;
      updatePreview();
    } else if (target.dataset.setting) {
      await save({ ...state, settings: { ...state.settings, [target.dataset.setting]: target.type === "checkbox" ? target.checked : target.value } });
    }
  });
  render();
  void load();
})();
</script></body></html>
