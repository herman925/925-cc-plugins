<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Team Orchestrator</title><style>:root {

* {

}

  color:inherit;
}

  line-height:1.4;
}
button:hover {
  border-color:var(--cyan);
}
button:disabled {
  opacity:.5;
  cursor:not-allowed;
}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {
  outline:2px solid var(--cyan);
  outline-offset:3px;
}
h1,h2,p {
  margin:0;
}
h1 {
  font-size:19px;
  font-weight:650;
  letter-spacing:-.3px;
}
h2 {
  font-size:13px;
  font-weight:650;
}
p {
  margin:8px 0;
  color:var(--dim);
}
small {
  font-size:11px;
  color:var(--dim);
}
code,pre {
  font:inherit;
}
main {
  padding:22px 18px 32px;
  max-width:1000px;
  margin:auto;
  min-height:calc(100vh - 132px);
}
.app-header {

  background:var(--bg);
  z-index:2;
  border-bottom:1px solid var(--line);
  padding:15px 18px 0;
}
.brand {
  display:flex;
  align-items:center;
  gap:9px;
  font-size:15px;
  font-weight:650;
}
.brand>span {
  color:var(--cyan);
}
.brand small {
  margin-left:auto;
  font-weight:400;
}
nav {
  display:flex;
  flex-wrap:wrap;
  gap:4px 16px;
  margin-top:14px;
}
nav button {
  border:0;
  border-bottom:2px solid transparent;
  border-radius:0;
  padding:7px 0 11px;
  background:transparent;
  color:var(--dim);
}
nav button.active {
  border-bottom-color:var(--cyan);
  color:var(--cyan);
}
.welcome {
  padding:10px 0;
}
.welcome>p {
  margin:8px 0 18px;
}
.sketch {
  margin:20px 0 26px;
  line-height:1.8;
  color:var(--dim);
  font-size:12px;
  white-space:pre;
  overflow:auto;
}
.head,.org-node.head>.glyph {
  color:var(--yellow);
}
.ceo>.glyph {
  color:var(--purple);
}
.lead>.glyph {
  color:var(--cyan);
}
.worker>.glyph {
  color:var(--dim);
}
.presets {
  display:grid;
  gap:8px;
  margin:10px 0 16px;
}
.preset {
  text-align:left;
  padding:11px 12px;
}
.preset>span {
  display:flex;
  justify-content:space-between;
  gap:8px;
}
.preset strong {
  font-size:12px;
  font-weight:550;
}
.preset code {
  color:var(--cyan);
  white-space:nowrap;
}
.preset small {
  display:block;
  margin-top:3px;
}
.secondary {
  background:transparent;
}
.primary {
  background:var(--cyan);
  color:#0c2027;
  border-color:var(--cyan);
  font-weight:650;
}
.primary:hover {
  filter:brightness(1.1);
}
.small {
  font-size:11px;
  padding:5px 8px;
}
.flow {
  margin-bottom:22px;
}
.steps {
  font-size:11px;
  margin-top:8px;
  color:var(--cyan);
}
.steps span {
  color:var(--dim);
  margin:0 4px;
}
.section {
  border-top:1px solid var(--line);
  padding:17px 0;
  margin:12px 0;
}
.section h2 {
  margin-bottom:15px;
}
.section h2>span {
  color:var(--cyan);
  margin-right:8px;
}
.field {
  display:flex;
  flex-direction:column;
  gap:7px;
  margin:15px 0;
  font-weight:550;
}
.field small {
  font-weight:400;
}
.field .presets {
  margin:0;
}
.field input,.field textarea,.field select,input[data-model],select[data-effort],select[data-agent] {
  width:100%;
  min-width:0;
  background:var(--surface);
  border:1px solid var(--line);
  padding:8px 10px;
  border-radius:5px;
  font-weight:400;
}
.field textarea {
  resize:vertical;
}
.segments {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.segments button {
  font-size:11px;
  font-weight:400;
}
.segments button[aria-pressed=true] {
  border-color:var(--cyan);
  color:var(--cyan);
  background:color-mix(in srgb,var(--cyan) 8%,var(--surface));
}
.subtle {
  font-size:11px;
  margin-top:-7px;
  margin-bottom:13px;
}
.table-scroll,.tree-scroll {
  overflow:auto;
  max-width:100%;
}
table {
  width:100%;
  border-collapse:collapse;
  text-align:left;
  font-size:11px;
}
th {
  font-weight:550;
  color:var(--dim);
}
th,td {
  padding:10px 7px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
.models th:first-child {
  padding-left:0;
  width:20%;
}
.models td {
  padding:7px 5px;
}
.models input,.models select {
  font-size:11px;
  min-width:95px;
}
.models input {
  width:100%;
}
.count {
  font-size:11px;
  margin-bottom:14px;
}
.org-tree {
  list-style:none;
  margin:0;
  padding-left:22px;
}
.org-tree.root {
  padding-left:0;
}
.org-tree li {
  position:relative;
  padding:5px 0;
}
.org-tree:not(.root)>li:before {
  content:'';
  position:absolute;
  left:-13px;
  top:0;
  bottom:0;
  border-left:1px solid var(--line);
}
.org-tree:not(.root)>li:last-child:before {
  height:20px;
}
.org-tree:not(.root)>li:after {
  content:'';
  position:absolute;
  left:-13px;
  top:20px;
  width:12px;
  border-top:1px solid var(--line);
}
.org-node {
  display:inline-flex;
  gap:8px;
  align-items:center;
  padding:5px 8px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:4px;
  white-space:nowrap;
  font-size:11px;
}
.org-node small {
  font-size:10px;
  margin-left:8px;
}
.tree-scroll {
  padding-bottom:4px;
}
.actions {
  display:flex;
  gap:9px;
  margin-top:14px;
}
.notice {
  border:1px solid var(--line);
  border-left:3px solid var(--yellow);
  border-radius:4px;
  padding:11px 12px;
  margin:0 0 16px;
  color:var(--dim);
  font-size:11px;
}
.notice.error {
  border-left-color:var(--danger);
  color:var(--danger);
}
.notice.error button {
  margin:8px 0 0;
  display:block;
}
.notice.success {
  border-left-color:var(--cyan);
  color:var(--fg);
}
.unavailable {
  max-width:560px;
  margin:12px auto;
  padding:20px;
  border:1px solid var(--line);
  border-left:3px solid var(--yellow);
  border-radius:6px;
  background:var(--surface);
}
.unavailable h1 {
  font-size:16px;
  color:var(--yellow);
}
.failure-details {
  margin-top:18px;
  padding-top:12px;
  border-top:1px solid var(--line);
  font-size:11px;
  overflow-wrap:anywhere;
}
.failure-details h1 {
  font-size:13px;
  color:var(--fg);
}
.validation {
  color:var(--danger);
  font-size:11px;
}
.section-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}
.team-cards {
  display:grid;
  gap:20px;
}
.team-cards.columns {

  margin-bottom:12px;

}

}

}

  height:6px;

  margin-right:5px;
}

  gap:8px;
  font-size:12px;
}
dt {
  color:var(--dim);
}
dd {
  margin:0;
  overflow-wrap:anywhere;
}
.check {

  align-items:center;
  gap:8px;
  margin:14px 0;
}
.check input {
  accent-color:var(--cyan);
}

  gap:10px;

  font-size:10px;
  color:var(--dim);
}

  padding:20px 0;
}

    font-size:11px;
  }
  .preset>span {

  }
}

    font-size:10px;
  }
  .org-node small {
    display:none;
  }
  .brand {
    font-size:13px;
  }
  footer {
    font-size:9px;
  }

  }

.organisation {

}

  width:50%;
}

}

}

  top:48px;
  height:9px;
  border-left:1px solid var(--line);

  border-radius:5px;
  padding:12px;
  margin:12px 0;
  overflow-wrap:anywhere;

  margin:0;
}
.task-state {
  color:var(--fg);
}
.task-text {
  white-space:pre-wrap;
}
.task-card details {
  margin:10px 0;
}

  cursor:pointer;
}

.member-name { font-weight:600; }
.team-heading-actions { display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:8px; }

  function settingsView() {

  }
  function unavailableView() {

  function render() {

  function updatePreview() {

  }
  async function load(retry = false) {

  async function refreshTargets() {

  async function refreshCapabilities(params, scope, force = false) {

  async function launchTeam(index) {
    const team = state.teams[index], members = initialMembers(team);
    if (!members.length) throw Error("No highest supervisor exists in this saved roster.");
    busy = true;
    problem = "";
    render();
    try {
      const failures = [];

      for (const [position, member] of members.entries()) {
        if (position) {
          message = `Starting ${position + 1} of ${members.length} members\u2026`;
          render();
          await new Promise((resolve) => setTimeout(resolve, 10100));

          failures.push(`${member.name}: ${error.message}`);

    } finally {

        state = validatePersistentState((await call("storage.get", {})).value);

  app.addEventListener("click", async (event) => {

          cleanupPreview = null;
          cleanupRequest = null;
          cleanupSelection.clear();

        problem = error.message;
      } finally {
        busy = false;
        render();
      }
    } else if (action === "cancel-cleanup") {
      cleanupPreview = null;
      cleanupRequest = null;
      render();
    } else if (action === "preset") {

      message = "";
      render();
    } else if (action === "pick") {

      if (field === "structure") {
        form.levels = form.structure === "organisation" ? 3 : 2;
        if (!form.groups) form.groups = "Team 1, Team 2";
      }
      render();
    } else if (action === "create") {
      try {
        if (!confirmedWorkspace) throw new Error("Confirm the project and execution host first.");

          await launchTeam(state.teams.length - 1);
          view = "roster";
          await refreshRoster();
          render();
        }
      } catch (error) {
        busy = false;
        message = "";
        problem = error.message;
        canRetry = false;
        render();
      }
    } else if (action === "retry" || action === "test-connection") {
      connectionReady = false;
      await load(action === "test-connection");
    } else if (action === "refresh-tabs") {
      confirmedWorkspace = null;
      await refreshTargets();
      render();
    } else if (action === "confirm-project") {
      confirmedWorkspace = workspace;
      await refreshCapabilities({ selectionToken: workspace.selectionToken }, workspace);
      render();
    } else if (action === "refresh-capabilities") {
      if (view === "new") {
        const scope = confirmedWorkspace || workspace;
        await refreshCapabilities({ selectionToken: scope.selectionToken }, scope, true);
      }
    } else if (action === "open-supervisor") {
      busy = true;
      problem = "";
      message = "";
      render();
      try {
        const team = state.teams.find((row) => row.id === target.dataset.team);
        const supervisor = team?.members.find((row) => row.boss === null);
        if (!supervisor || supervisor.id !== target.dataset.member) throw Error("The team supervisor has changed. Refresh the roster.");
        await call("openMember", { teamId: team.id, memberId: supervisor.id, requestId: target.dataset.request });
        message = "Opened the supervisor\u2019s session.";
      } catch (error) {
        problem = error.message;
      } finally {
        busy = false;
        render();
      }
    } else if (action === "launch-existing") {
      try {
        await launchTeam(Number(target.dataset.team));
      } catch (error) {
        problem = error.message;
        canRetry = false;
        render();
      }
    }
  });
  app.addEventListener("input", (event) => {
    const target = event.target;
    if (target.dataset.form) {
      form[target.dataset.form] = target.value;
      updatePreview();
    }

  app.addEventListener("change", async (event) => {
    const target = event.target;
    if (target.dataset.cleanupWork) {
      if (target.checked) cleanupSelection.add(target.dataset.cleanupWork);
      else cleanupSelection.delete(target.dataset.cleanupWork);

      cleanupRequest = null;
      render();

      render();

    try {
      const result = await call("rosterStatus", {});
      if (busy || view !== "roster") return;
      if (result.value.revision >= state.revision) state = validatePersistentState(result.value);
