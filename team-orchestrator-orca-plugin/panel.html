code,pre {

}

}
.brand small {

}
nav {

  gap:4px 16px;
  margin-top:14px;
}

  border-bottom:2px solid transparent;
  border-radius:0;
  padding:7px 0 11px;

}
.welcome {

}

.secondary {

.flow {

}

.field .presets {

}

}
.field textarea {

}
.segments {

}

}
.subtle {

  margin-top:-7px;
  margin-bottom:13px;
}
.table-scroll,.tree-scroll {
  overflow:auto;
  max-width:100%;
}
table {
  width:100%;
  border-collapse:collapse;
  text-align:left;
  font-size:11px;
}
th {
  font-weight:550;
  color:var(--dim);
}
th,td {
  padding:10px 7px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
.models th:first-child {
  padding-left:0;
  width:20%;
}
.models td {
  padding:7px 5px;
}
.models input,.models select {
  font-size:11px;
  min-width:95px;
}
.models input {
  width:100%;
}
.count {
  font-size:11px;
  margin-bottom:14px;
}

}

}

}

.actions {

.org-chart .glyph {
  font-size:15px;
}
.org-chart .org-node small {

  padding:12px;

  overflow-wrap:anywhere;

.task-card h4 {
  margin:0;

.task-state {
  color:var(--fg);
}
.task-text {
  white-space:pre-wrap;
}
.task-card details {
  margin:10px 0;
}
.task-card summary {
